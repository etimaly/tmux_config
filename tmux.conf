# ==========================
# CUSTOM MEMORY USAGE (Non-Plugin Fix)
# This overrides the Catppuccin module system to guarantee memory display.
# ==========================
# Set an update interval (in seconds)
set -g status-interval 5

# DONE WITH AN PLUGIN # Execute the external script to display RAM usage
# set -g status-right '#(~/.config/tmux/tmux_ram_status.sh) | #S'

# Use xclip to copy and paste with the system clipboard
bind C-c run "tmux save-buffer - | xclip -i -sel clip"
bind C-v run "tmux set-buffer $(xclip -o -sel clip); tmux paste-buffer"

# ==========================
# 1. CORE SETTINGS
# ==========================
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Status Bar at Top
set-option -g status-position top

# ==========================
# 2. THEME CONFIGURATION (Catppuccin)
# NOTE: Catppuccin's internal status-right modules are now disabled
# because we are overriding the 'status-right' setting above.
# ==========================
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_middle_separator " | "

# Color overrides for active/inactive windows
set -g @catppuccin_window_default_fill "none"
set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_default_color "#6c7086"
set -g @catppuccin_window_default_background "#1e1e2e"
set -g @catppuccin_window_current_color "#1e1e2e"
set -g @catppuccin_window_current_background "#cba6f7"

# REMOVED: This line is ignored because we are using 'set -g status-right' above.
# set -g @catppuccin_status_modules_right "ram session" 

# ==========================
# 3. CPU & MEMORY LOAD
# ==========================

set -g status-right "#[fg=green]#($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load --colors --powerline-right --interval 2)#[default]"

# ==========================
# 4. PLUGINS (TPM handles the rest)
# ==========================
# Keep these lines so other plugins (like tmux-resurrect) still work.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'alberti42/tmux-fzf-links'
# set -g @plugin 'tmux-plugins/tmux-sensible'

# TPM Initialization (Must remain at the bottom)
run '~/.config/tmux/plugins/tpm/tpm'
