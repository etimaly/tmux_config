# ==========================
# CUSTOM MEMORY USAGE (Non-Plugin Fix)
# This overrides the Catppuccin module system to guarantee memory display.
# ==========================

# Set an update interval (in seconds)
set -g status-interval 5

# Enable system clipboard integration
set -g set-clipboard on

# ==========================
# 1. CORE SETTINGS
# ==========================
# set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Toggle a floating popup window
bind f display-popup -w 80% -h 80% -E

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Clear the scrollback buffer with Prefix + Ctrl + l
bind C-l clear-history

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split panes horizontally
bind % split-window -h -c "#{pane_current_path}"

# Split panes vertically
bind '"' split-window -v -c "#{pane_current_path}"

# Open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# Enable vi keys in copy mode
set-window-option -g mode-keys vi

# Use 'v' to start selection like in Neovim
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Use 'y' to yank (copy) the selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Optional: Use 'Ctrl+v' to toggle rectangle selection (block-visual mode)
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Status Bar at Top
set-option -g status-position top

# Automatically restore tmux windows when tmux starts
# set -g @continuum-restore 'on'

# ==========================
# 2 & 3. THEME & CPU/MEM STATUS
# ==========================
set -g @catppuccin_flavor 'mocha'

# Dim inactive panes
set -g window-style 'bg=#181825'        # Catppuccin Mocha Mantle (slightly darker)
set -g window-active-style 'bg=#1e1e2e' # Catppuccin Mocha Base (normal)

# The new, simpler way to get the "pill" style
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"

# Add a space for breathability and a zoom icon when a pane is zoomed
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag, ,}"

# Make the active window tab completely filled with color
set -g @catppuccin_window_current_background "#{@thm_mauve}"

# Increase lengths so your long memory script isn't cut off
set -g status-left-length 100
set -g status-right-length 100

# Clear the right side first
set -g status-right ""

# 0. Prefix Indicator (Lights up red when prefix is active)
set -ag status-right "#{?client_prefix,#[bg=#{@thm_red} fg=#{@thm_crust} bold]  PREFIX ,}"

# 1. Directory pill
set -ag status-right "#[bg=#{@thm_mauve},fg=#{@thm_crust},bold]  #[bg=#{@thm_surface_1},fg=#{@thm_fg}] #{pane_current_path} "

# 2. Your custom CPU/RAM script 
set -ag status-right "#[bg=#{@thm_blue},fg=#{@thm_crust},bold]  #[bg=#{@thm_surface_1},fg=#{@thm_fg}] #(~/.config/tmux/plugins/tmux-mem-cpu-load/tmux-mem-cpu-load --interval 2 -a 0 -g 0) "

# 3. Catppuccin session module
set -ag status-right "#{E:@catppuccin_status_session}"

# ==========================
# 4. PLUGINS (TPM handles the rest)
# ==========================
# Keep these lines so other plugins (like tmux-resurrect) still work.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'alberti42/tmux-fzf-links'
# set -g @plugin 'tmux-plugins/tmux-sensible'

# TPM Initialization (Must remain at the bottom)
run '~/.config/tmux/plugins/tpm/tpm'

